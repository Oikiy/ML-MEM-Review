[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-mem-review"
version = "1.0.3"
description = "ML-inverse design workflow for membrane development (ML-MEM)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
opt = [
    "ax-platform>=0.4",
    "botorch>=0.11",
    "scikit-optimize>=0.10",
    "plotly>=5.20",
]
shap = [
    "shap>=0.45",
]
imblearn = [
    "imbalanced-learn>=0.12",
]
notebook = [
    "notebook>=7",
]
all = [
    "ax-platform>=0.4",
    "botorch>=0.11",
    "scikit-optimize>=0.10",
    "plotly>=5.20",
    "shap>=0.45",
    "imbalanced-learn>=0.12",
    "notebook>=7",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyter>=1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "run_pipeline",
    "utl_Ax",
    "utl_config_loader",
    "utl_eda",
    "utl_expr",
    "utl_feateng",
    "utl_fileIO",
    "utl_model_arch",
    "utl_modelling",
    "utl_shap",
]

[project.scripts]
ml-mem-review = "run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: end-to-end example pipeline runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"